version: '3.8'

services:
  # Main Application
  rex-ai-assistant:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=development
      - FLASK_DEBUG=1
    volumes:
      - .:/app
      - /app/__pycache__
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Optional: Redis for caching (if needed)
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    profiles: ["with-redis"]

  # Optional: PostgreSQL database (if needed)
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: rex_ai_db
      POSTGRES_USER: rex_user
      POSTGRES_PASSWORD: rex_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    profiles: ["with-db"]

  # Nginx reverse proxy for production-like setup
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./static:/usr/share/nginx/html/static:ro
    depends_on:
      - rex-ai-assistant
    restart: unless-stopped
    profiles: ["with-nginx"]

volumes:
  redis_data:
  postgres_data:

networks:
  default:
    name: rex-ai-network
